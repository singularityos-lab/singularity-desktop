name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Give the request a **specific title** that names the feature, not `please add stuff`.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way? The "why" matters most.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Component / area
      description: Choose the closest match. Select Not sure if you do not know.
      options:
        - Not sure
        - Shell, panel, dock and overview
        - Settings and control center
        - Window management and labwc
        - Desktop session and startup
        - Greeter, lock screen and login UI
        - Notifications
        - Files
        - Leafs terminal
        - Edit
        - Write
        - Store
        - Monitor
        - Calculator
        - Calendar
        - Git
        - Music
        - Photos
        - Videos
        - Keyring and authentication
        - Plugins and widgets
        - Themes and wallpapers
        - Desktop portal and screen capture
        - libsingularity and shared UI
        - Desktop build, packaging and installation
        - Website and documentation
        - Developer tools and demo
        - Other
    validations:
      required: true
